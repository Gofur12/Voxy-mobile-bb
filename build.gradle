def smartDependency = { String property, boolean runtime = false, String maven = null, boolean compile = true ->
    String ver;
    if (voxyProfile.containsKey("runtime."+property) || project.hasProperty("runtime."+property)) {
        ver = voxyProfile.containsKey("runtime."+property) ? voxyProfile["runtime."+property] : project["runtime."+property];
        runtime = true
    } else if (voxyProfile.containsKey("compileOnly."+property) || project.hasProperty("compileOnly."+property)) {
        ver = voxyProfile.containsKey("compileOnly."+property) ? voxyProfile["compileOnly."+property] : project["compileOnly."+property];
        runtime = false
    } else {
        ver = voxyProfile.containsKey(property) ? voxyProfile[property] : project.findProperty(property);
    }

    if (ver == null) {
        return null;
    }

    Object dep;
    if (ver.endsWith(".jar")) {
        //File type
        dep = files(ver)
    } else {//Asume mvn
        //Hack, default modrinth maven
        if (maven == null) {
            maven = "maven.modrinth:"+(property.split("_")[0])
        }

        dep = (maven!=null?(maven+":"):"")+ver;
    }
    dependencies {
        if (compile && runtime) {
            implementation(dep)
        } else {
            if (compile) {
                compileOnly(dep)
            } else {
                runtimeOnlyMsk(dep)
            }
        }
    }
    return ver
}


