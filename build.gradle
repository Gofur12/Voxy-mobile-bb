plugins {
    // Loom 1.14+ separates remapping (<= 1.21.11) from non-remapping (26.1+).
    // Resolve both plugin markers, then apply only the one matching voxyTarget below.
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'maven-publish'
    id "me.champeau.jmh" version "0.7.3"
}

// Select an isolated Minecraft target without changing the repository defaults.
def voxyTarget = providers.gradleProperty("voxyTarget").getOrElse("26.3")
apply plugin: (voxyTarget == "1.20.1" ? "net.fabricmc.fabric-loom-remap" : "net.fabricmc.fabric-loom")

// Keep the modern 26.3 implementation as the default source tree. The 1.20.1
// profile adds narrowly scoped source replacements for Minecraft API renames.
if (voxyTarget == "1.20.1") {
    sourceSets {
        main {
            java {
                srcDir "src/1.20.1/java"
                exclude { element ->
                    def mainSourceRoot = file("src/main/java").toPath().toAbsolutePath().normalize()
                    def candidate = element.file.toPath().toAbsolutePath().normalize()
                    def isMainTree = candidate.startsWith(mainSourceRoot)
                    def replacedByLegacySource = [
                        "me/cortex/voxy/commonImpl/WorldIdentifier.java",
                        "me/cortex/voxy/common/voxelization/WorldConversionFactory.java",
                        "me/cortex/voxy/client/core/model/ModelStore.java",
                        "me/cortex/voxy/client/core/gl/shader/ShaderLoader.java",
                        "me/cortex/voxy/client/core/rendering/ViewportSelector.java",
                        "me/cortex/voxy/client/DebugEntries.java",
                        "me/cortex/voxy/client/VoxyClientInstance.java",
                        "me/cortex/voxy/client/mixin/sodium/AccessorSodiumWorldRenderer.java",
                        "me/cortex/voxy/client/mixin/sodium/MixinSodiumWorldRenderer.java",
                        "me/cortex/voxy/client/mixin/sodium/AccessorChunkTracker.java",
                        "me/cortex/voxy/client/core/rendering/bounding/ColumnStreamedBoundStore.java",
                        "me/cortex/voxy/client/mixin/sodium/MixinVisibleChunkCollector.java",
                        "me/cortex/voxy/client/core/RenderProperties.java",
                        "me/cortex/voxy/client/core/util/IrisUtil.java",
                        "me/cortex/voxy/client/mixin/sodium/MixinDefaultChunkRenderer.java",
                        "me/cortex/voxy/client/mixin/sodium/MixinRenderSectionManager.java"
                    ].contains(element.path)
                    def modernConfigOnly = [
                        "me/cortex/voxy/client/config/SodiumConfigBuilder.java",
                        "me/cortex/voxy/client/config/VoxyConfigMenu.java",
                        "me/cortex/voxy/client/config/ModMenuIntegration.java"
                    ].contains(element.path)
                    def optionalModernIntegration = [
                        "me/cortex/voxy/client/VoxyDebugScreenEntry.java",
                        "me/cortex/voxy/client/mixin/minecraft/MixinDebugScreenEntryList.java",
                        "me/cortex/voxy/client/mixin/minecraft/util/MixinGlDebug.java",
                        "me/cortex/voxy/client/mixin/nvidium/MixinRenderPipeline.java",
                        "me/cortex/voxy/client/mixin/flashback/MixinFlashbackMeta.java",
                        "me/cortex/voxy/client/mixin/flashback/MixinFlashbackRecorder.java",
                        "me/cortex/voxy/commonImpl/mixin/chunky/MixinFabricWorld.java",
                        "me/cortex/voxy/client/mixin/iris/MixinLevelRenderer.java",
                        "me/cortex/voxy/client/mixin/iris/MixinIrisRenderingPipeline.java",
                        "me/cortex/voxy/client/mixin/sodium/MixinFallbackVisibleChunkCollector.java",
                        "me/cortex/voxy/client/mixin/sodium/MixinRenderRegionManager.java"
                    ].contains(element.path)
                    return isMainTree && (replacedByLegacySource || modernConfigOnly || optionalModernIntegration)
                }
            }
        }
    }
}

def voxyProfile = [:]
switch (voxyTarget) {
    case "26.3":
        break // Keep gradle.properties as the source of truth for the default target.
    case "1.20.1":
        voxyProfile.putAll([
            minecraft_version: "1.20.1",
            loader_version: "0.19.2",
            fabric_api_version: "0.92.8+1.20.1",
            sodium_version_modrinth: "mc1.20.1-0.5.13-fabric",
            sodium_extra_allows: "",
            modmenu_version: "7.2.2",
            lithium_version: "mc1.20.1-0.11.3-fabric",
            "runtime.iris_version": "1.7.6+1.20.1",
            // Optional integrations below are pinned to modern Minecraft releases
            // in gradle.properties. Do not leak those jars into the 1.20.1 Loom
            // remapping classpath; add target-compatible versions explicitly later.
            chunky_version: null,
            vivecraft_version: null,
            flashback_version: null,
            nvidium_version: null,
            target_java_version: "17"
        ])
        break
    default:
        throw new GradleException("Unsupported -PvoxyTarget='" + voxyTarget + "'. Supported targets: 26.3, 1.20.1")
}

