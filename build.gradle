def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

def findSodiumVersion = { ->
    String sodiumValue = voxyProperty("sodium_version_modrinth")
    boolean modrinthVersion = sodiumValue != null
    if (!modrinthVersion) {
        sodiumValue = voxyProperty("sodium_version")
    }
    if (sodiumValue == null) {
        throw new GradleException("No Sodium version configured for target " + voxyTarget)
    }
    String versionStr = modrinthVersion ? (sodiumValue =~ /[^-]*-([^-]*-?[^-]*)-.*/)[0][1] : sodiumValue.split("\\+")[0]
    return [modrinthVersion ? ["sodium_version", "modrinth"] : ["sodium_version"], modrinthVersion, sodiumValue, versionStr]
}

processResources {
    String sodium_versions;
    {
        StringBuilder sodium_versions_builder = new StringBuilder("[");
        var vers = [*(voxyProperty("sodium_extra_allows") ?: "").split(" ")];
        for (String ver : vers) {
            if (!ver.isBlank()) {
                sodium_versions_builder.append("\"=").append(ver).append("\", ");
            }
        }

        var (props, _, _2, sodium_version) = findSodiumVersion();
        var expectExact = props.contains("exact");

        if (expectExact) {
            sodium_versions_builder.append("\"=").append(sodium_version).append("\"");
        } else {
            sodium_version = sodium_version.split("-")[0]
            sodium_versions_builder.append("\">=").append(sodium_version).append("- <=").append(sodium_version).append("\"")
        }
        sodium_versions_builder.append("]");
        sodium_versions = sodium_versions_builder.toString();
    }
    String allowed_mc_version;
    {
        allowed_mc_version = voxyProperty("minecraft_version").split("-")[0];
        allowed_mc_version = "[\">=" + allowed_mc_version + "- <=" + allowed_mc_version + "\", \"~" + allowed_mc_version + "\"]";
    }

    var time = buildtime()
    var hash = gitCommitHash()
    var version = project.version

    def props = ["version": version, "commit": hash, "buildtime": time, "allowed_sodium_versions": sodium_versions, "allowed_mc_version": allowed_mc_version]

    for (var prop : props) {
        String value = prop.value;
        if (!(value==~/^ *((['"\[{].*)|([0-9]*$))/)) {
            value = "\"$value\"";
        }
        props[prop.key] = value
    }

    inputs.properties(props);
    filesMatching("fabric.mod.json") {
        filter {line->line.replace("\"\${","\${").replace("}\"", "}")};
        expand(props);
    }
}


var dummySodiumProviderGenerator = tasks.register("dummySodiumProviderGenerator", Jar) {
